apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minha-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://https://github.com/joaobcandido/posto-de-gasolina.git'
    targetRevision: main
    path: k8s/minha-app
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated: {}


